name: Publish

on:
  workflow_dispatch: # allow manual trigger from Actions tab
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

env:
  NODE_VERSION: 22

jobs:
  publish:
    name: Version PR
    runs-on: ubuntu-latest
    # Only run if CI passed (or manual trigger) AND not a version-bump commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore: version packages'))
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Auto-generate changeset from conventional commits if none exists
      - name: Auto-generate changeset from conventional commits
        id: auto-changeset
        run: |
          # Check if any changeset files exist (besides README.md and config.json)
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$CHANGESETS" ]; then
            echo "Manual changeset found, skipping auto-generation"
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine the compare baseline from the last *successfully published*
          # version. Using npm as source of truth avoids replaying commits when
          # a version-bump commit exists but the actual npm publish failed.
          COMPARE_REF=""
          PUBLISHED_VERSION=$(npm view @prontiq/ariscan-cli version 2>/dev/null || echo "")

          if [ -n "$PUBLISHED_VERSION" ]; then
            echo "Last published version on npm: $PUBLISHED_VERSION"
            # Try to find the corresponding git tag
            TAG_REF=$(git tag -l "@prontiq/ariscan-cli@${PUBLISHED_VERSION}" 2>/dev/null || echo "")
            if [ -n "$TAG_REF" ]; then
              COMPARE_REF="$TAG_REF"
            else
              # Tag missing — walk version-bump commits to find the one that
              # set the published version. Using -1 would grab the most recent
              # version-bump commit which may be a later *failed* publish.
              while IFS= read -r CANDIDATE; do
                COMMIT_VERSION=$(git show "$CANDIDATE:packages/cli/package.json" 2>/dev/null \
                  | node -e "process.stdin.setEncoding('utf8');let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version)}catch{}})" 2>/dev/null || echo "")
                if [ "$COMMIT_VERSION" = "$PUBLISHED_VERSION" ]; then
                  COMPARE_REF="$CANDIDATE"
                  echo "Found version-bump commit for $PUBLISHED_VERSION: $CANDIDATE"
                  break
                fi
              done < <(git log --format='%H' --grep="^chore: version packages")
            fi
          fi

          if [ -z "$COMPARE_REF" ]; then
            # Nothing published yet or no matching commit — compare against repo root
            COMPARE_REF=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Comparing commits since: $COMPARE_REF"

          # Analyze conventional commit prefixes to determine bump type
          BUMP="none"
          SUMMARY_FILE=$(mktemp)

          while IFS= read -r MSG; do
            # Skip merge commits and version commits
            case "$MSG" in
              Merge*|chore:\ version*) continue ;;
            esac

            # Check for breaking changes (major)
            if printf '%s' "$MSG" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
              printf -- '- %s\n' "$MSG" >> "$SUMMARY_FILE"
            # Check for features (minor)
            elif printf '%s' "$MSG" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
              printf -- '- %s\n' "$MSG" >> "$SUMMARY_FILE"
            # Check for fixes (patch)
            elif printf '%s' "$MSG" | grep -qE '^fix(\(.+\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
              printf -- '- %s\n' "$MSG" >> "$SUMMARY_FILE"
            # docs, chore, refactor, etc. — collect but don't bump
            elif printf '%s' "$MSG" | grep -qE '^(docs|chore|refactor|perf|style|test|ci)(\(.+\))?:'; then
              printf -- '- %s\n' "$MSG" >> "$SUMMARY_FILE"
            fi
          done < <(git log "$COMPARE_REF"..HEAD --format='%s' --no-merges)

          if [ "$BUMP" = "none" ]; then
            # Check if there are any commits at all since last tag
            COMMIT_COUNT=$(git rev-list "$COMPARE_REF"..HEAD --no-merges --count)
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "No conventional-commit bumps found, defaulting to patch ($COMMIT_COUNT commits)"
              BUMP="patch"
              git log "$COMPARE_REF"..HEAD --format='- %s' --no-merges > "$SUMMARY_FILE"
            else
              echo "No new commits since $COMPARE_REF"
              echo "has_changeset=false" >> "$GITHUB_OUTPUT"
              rm -f "$SUMMARY_FILE"
              exit 0
            fi
          fi

          echo "Detected bump type: $BUMP"
          echo "has_changeset=true" >> "$GITHUB_OUTPUT"

          # Generate changeset file (write frontmatter, then append summary)
          {
            printf '%s\n' '---'
            printf '"%s": %s\n' "@prontiq/ariscan-schema" "$BUMP"
            printf '"%s": %s\n' "@prontiq/ariscan-engine" "$BUMP"
            printf '"%s": %s\n' "@prontiq/ariscan-cli" "$BUMP"
            printf '%s\n\n' '---'
            cat "$SUMMARY_FILE"
          } > .changeset/auto-from-commits.md

          rm -f "$SUMMARY_FILE"

          echo "Generated changeset:"
          cat .changeset/auto-from-commits.md

      # Version packages (bumps package.json, writes CHANGELOGs, removes changeset files)
      - name: Version packages
        if: steps.auto-changeset.outputs.has_changeset == 'true'
        run: pnpm version-packages

      # Create a PR for the version bump (respects branch protection rules)
      # Uses App token so the merge push triggers publish-on-merge.yml
      - name: Create version bump PR
        if: steps.auto-changeset.outputs.has_changeset == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/version-packages"

          # Create branch from current HEAD and commit version bump
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: version packages [skip ci]" || {
            echo "Nothing to commit"
            exit 0
          }

          # Force-push to overwrite any stale version branch
          git push origin "$BRANCH" --force

          # Create PR or update existing one
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
          else
            gh pr create \
              --title "chore: version packages" \
              --body "Automated version bump from conventional commits. Auto-generated by the publish workflow." \
              --base main \
              --head "$BRANCH"
          fi

          # Enable auto-merge so it merges once CI passes
          gh pr merge "$BRANCH" --auto --squash
