name: Test ARI Action

on:
  pull_request:
    branches: [main]
    paths:
      - "action/**"
      - ".github/workflows/test-action.yml"

permissions:
  pull-requests: write
  contents: read

jobs:
  test-action:
    name: Test ARI Action (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build the CLI from source so the local action can install it
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Make the built CLI available on PATH via pnpm workspace bin
      - name: Add CLI to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Run the action against this repo (using local action definition)
      - name: Run ARI Action
        id: ari
        uses: ./action
        with:
          skip-install: "true"
          delta: "false"
          comment: "false"
          annotations: "true"
          fail-on-violation: "false"

      - name: Verify outputs
        env:
          ARI_SCORE: ${{ steps.ari.outputs.score }}
          ARI_LEVEL: ${{ steps.ari.outputs.level }}
        run: |
          echo "Score: $ARI_SCORE"
          echo "Level: $ARI_LEVEL"
          [ -n "$ARI_SCORE" ] || { echo "::error::Missing score output"; exit 1; }
          [ -n "$ARI_LEVEL" ] || { echo "::error::Missing level output"; exit 1; }
