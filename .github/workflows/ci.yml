name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  ARI_SCORE_FLOOR: 70
  ARI_PILLAR_FLOOR: 35

jobs:
  # ─── Fast checks (no build needed) ────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Type check (needs workspace deps built) ──────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ─── Test suite with coverage ─────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ─── Build (depends on quality gates) ─────────────────────────
  build:
    name: Build
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── Self-scan: dog-food the scanner ──
      - name: Self-scan (ARI)
        id: ari
        run: |
          node packages/cli/dist/cli.js . --json > scan-result.json
          SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scan-result.json','utf8')).score)")
          LEVEL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scan-result.json','utf8')).level)")
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "### ARI Self-Scan: $SCORE/100 ($LEVEL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan result
        uses: actions/upload-artifact@v4
        with:
          name: ari-scan-result
          path: scan-result.json
          retention-days: 90

      # ── SARIF upload for GitHub Code Scanning ──
      - name: Generate SARIF report
        continue-on-error: true
        run: node packages/cli/dist/cli.js . --format sarif > ari-sarif.sarif

      - name: Upload ARI SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: ari-sarif.sarif
          category: ariscan

      # ── Composite score floor gate ──
      - name: ARI composite score gate
        run: |
          SCORE=${{ steps.ari.outputs.score }}
          FLOOR=${{ env.ARI_SCORE_FLOOR }}
          if [ "$SCORE" -lt "$FLOOR" ]; then
            echo "::error::ARI composite score $SCORE is below floor $FLOOR"
            exit 1
          fi
          echo "✓ ARI composite score $SCORE meets floor $FLOOR"

      # ── Scaffold→scan gate: verify init presets score L3+ (S.04) ──
      - name: ARI scaffold gate (bare)
        run: |
          TMPDIR=$(mktemp -d)
          node packages/cli/dist/cli.js init --preset bare --name scaffold-bare --skip-scan "$TMPDIR/scaffold-bare"
          mkdir -p "$TMPDIR/scaffold-bare/.git"
          node packages/cli/dist/cli.js "$TMPDIR/scaffold-bare" --json > scaffold-bare.json
          SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scaffold-bare.json','utf8')).score)")
          echo "### Bare preset score: $SCORE/100" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCORE" -lt 46 ]; then
            echo "::error::Bare preset score $SCORE is below L3 floor (46)"
            exit 1
          fi
          echo "✓ Bare preset scores $SCORE (L3+ verified)"
          rm -rf "$TMPDIR"

      - name: ARI scaffold gate (nextjs)
        run: |
          TMPDIR=$(mktemp -d)
          node packages/cli/dist/cli.js init --preset nextjs --name scaffold-nextjs --skip-scan "$TMPDIR/scaffold-nextjs"
          mkdir -p "$TMPDIR/scaffold-nextjs/.git"
          node packages/cli/dist/cli.js "$TMPDIR/scaffold-nextjs" --json > scaffold-nextjs.json
          SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scaffold-nextjs.json','utf8')).score)")
          echo "### Next.js preset score: $SCORE/100" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCORE" -lt 46 ]; then
            echo "::error::Next.js preset score $SCORE is below L3 floor (46)"
            exit 1
          fi
          echo "✓ Next.js preset scores $SCORE (L3+ verified)"
          rm -rf "$TMPDIR"

      # ── Per-pillar floor gate ──
      - name: ARI pillar floor gate
        run: |
          PILLAR_FLOOR=${{ env.ARI_PILLAR_FLOOR }}
          FAILED=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('scan-result.json','utf8'));
            const floor = ${PILLAR_FLOOR};
            const failed = (r.pillars||[]).filter(p => p.score < floor);
            if (failed.length > 0) {
              failed.forEach(p => console.error('::error::' + p.pillar + ' ' + p.name + ' score ' + p.score + ' is below pillar floor ' + floor));
              process.exit(1);
            }
            (r.pillars||[]).forEach(p => console.log('✓ ' + p.pillar + ' ' + p.name + ': ' + p.score + '/100'));
          ")

  # ─── Dependency review (PRs only) ─────────────────────────────
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
