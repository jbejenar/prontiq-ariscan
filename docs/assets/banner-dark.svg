<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e05d44"/>
      <stop offset="25%" stop-color="#fe7d37"/>
      <stop offset="50%" stop-color="#dfb317"/>
      <stop offset="75%" stop-color="#97ca00"/>
      <stop offset="100%" stop-color="#44cc11"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="280" rx="12" fill="url(#grid)" opacity="0.5"/>

  <!-- Decorative radar/gauge arcs (top-right) -->
  <g transform="translate(750, 140)" opacity="0.15">
    <circle r="120" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <circle r="90" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <circle r="60" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="-85" y1="-85" x2="85" y2="85" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="85" y1="-85" x2="-85" y2="85" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Radar filled area -->
  <g transform="translate(750, 140)" opacity="0.25">
    <polygon points="0,-100 70,-50 85,30 50,75 -20,80 -75,40 -90,-15 -45,-80"
             fill="url(#accent)" stroke="#58a6ff" stroke-width="1.5"/>
  </g>

  <!-- Score bar decoration (bottom) -->
  <rect x="60" y="230" width="540" height="6" rx="3" fill="#21262d"/>
  <rect x="60" y="230" width="497" height="6" rx="3" fill="url(#scoreGrad)" filter="url(#glow)"/>
  <text x="610" y="236" font-family="monospace" font-size="13" fill="#8b949e">92 / 100</text>

  <!-- Title -->
  <text x="60" y="85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="url(#accent)" letter-spacing="-1">
    Prontiq ARI
  </text>

  <!-- Subtitle -->
  <text x="62" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#8b949e" letter-spacing="4">
    AGENT READINESS INDEX
  </text>

  <!-- Tagline -->
  <text x="62" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#c9d1d9">
    Measure and improve how ready your codebase is for AI coding agents.
  </text>

  <!-- Feature pills -->
  <g transform="translate(62, 185)">
    <rect width="90" height="26" rx="13" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="45" y="17" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">8 Pillars</text>
  </g>
  <g transform="translate(164, 185)">
    <rect width="115" height="26" rx="13" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="57" y="17" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">117 Findings</text>
  </g>
  <g transform="translate(291, 185)">
    <rect width="95" height="26" rx="13" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="47" y="17" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">841 Tests</text>
  </g>
  <g transform="translate(398, 185)">
    <rect width="130" height="26" rx="13" fill="#238636" opacity="0.2" stroke="#3fb950" stroke-width="1"/>
    <text x="65" y="17" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">L5 Autonomous</text>
  </g>
  <g transform="translate(540, 185)">
    <rect width="100" height="26" rx="13" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="50" y="17" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">--fix in 1 cmd</text>
  </g>

  <!-- Version pill (top-right) -->
  <rect x="770" y="20" width="110" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="825" y="37" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">v0.49.0</text>
</svg>
