# Monorepo ARI scoring — per-package scanning on every merge request.
# Each package gets its own scan job with independent results.
# Copy this file to .gitlab-ci.yml in your repository.
#
# Prerequisites:
#   1. Set GITLAB_TOKEN in CI/CD Settings (api scope) for MR comments
#   2. Copy gitlab/scripts/ into your repo for MR comment + Code Quality support
include:
  - remote: "https://raw.githubusercontent.com/prontiq/ariscan/main/gitlab/ariscan.gitlab-ci.yml"

ari-scan-api:
  extends: .ari-scan
  variables:
    ARI_PATH: "packages/api"

ari-scan-web:
  extends: .ari-scan
  variables:
    ARI_PATH: "packages/web"

ari-scan-shared:
  extends: .ari-scan
  variables:
    ARI_PATH: "packages/shared"
