name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger as safety valve

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false # never cancel a publish mid-flight

env:
  NODE_VERSION: 22

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Only run when the version-bump PR merges (or manual dispatch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: version packages')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Self-scan to produce artifact for GitHub Release
      - name: Self-scan (ARI)
        run: node packages/cli/dist/cli.js . --json > scan-result.json

      - name: Publish to npm
        id: npm-publish
        run: |
          set -euo pipefail

          pnpm changeset publish --provenance 2>&1 | tee publish-output.txt

          # Extract published packages for the release step
          PUBLISHED=$(grep -oE '@prontiq/ariscan-[a-z]+@[0-9]+\.[0-9]+\.[0-9]+' publish-output.txt || true)

          if [ -n "$PUBLISHED" ]; then
            echo "published_any=true" >> "$GITHUB_OUTPUT"
            echo "### Published packages" >> "$GITHUB_STEP_SUMMARY"
            echo "$PUBLISHED" | while read -r pkg; do
              echo "- $pkg" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            # Nothing new was published — check per-package if this is a
            # rerun where some or all packages already exist on npm (e.g.
            # prior run published but failed during tag/release creation).
            VERSION=$(node -p "require('./packages/cli/package.json').version")
            NPM_COUNT=0
            echo "### Rerun — checking npm for existing packages" >> "$GITHUB_STEP_SUMMARY"
            for PKG in schema engine cli; do
              FULL="@prontiq/ariscan-${PKG}"
              if npm view "${FULL}@${VERSION}" version >/dev/null 2>&1; then
                NPM_COUNT=$((NPM_COUNT + 1))
                echo "- ${FULL}@${VERSION} ✓ on npm" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- ${FULL}@${VERSION} ✗ NOT on npm" >> "$GITHUB_STEP_SUMMARY"
              fi
            done

            if [ "$NPM_COUNT" -gt 0 ]; then
              echo "$NPM_COUNT/3 packages already on npm — continuing to release step"
              echo "published_any=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Version bump commit detected but no packages were published and none found on npm for $VERSION."
              exit 1
            fi
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub Releases with ARI scan artifact
      - name: Create GitHub Releases
        if: steps.npm-publish.outputs.published_any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the version from CLI package (all packages share the same version)
          VERSION=$(node -p "require('./packages/cli/package.json').version")

          for PKG in schema engine cli; do
            FULL="@prontiq/ariscan-${PKG}"
            TAG="${FULL}@${VERSION}"

            # Only create tags/releases for packages confirmed on npm
            if ! npm view "${FULL}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping $TAG — not found on npm"
              continue
            fi

            echo "Creating release for $TAG"

            # Create a git tag (may already exist)
            git tag "$TAG" 2>/dev/null || echo "Tag $TAG already exists"
            git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already pushed"

            # Create or update the GitHub release
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists, uploading artifact"
              gh release upload "$TAG" scan-result.json --clobber || echo "Warning: could not upload artifact to $TAG"
            else
              gh release create "$TAG" \
                scan-result.json \
                --title "$TAG" \
                --notes "Published from $(git rev-parse --short HEAD). ARI scan result attached." || \
                echo "Warning: could not create release for $TAG"
            fi
          done
